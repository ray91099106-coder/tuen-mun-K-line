<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
      <feOffset dx="0" dy="10" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="448" height="448" x="32" y="32" rx="112" fill="url(#bg-grad)" />
  
  <!-- Bus Shape -->
  <g filter="url(#shadow)">
    <path d="M140 160c0-30 25-55 55-55h122c30 0 55 25 55 55v180c0 15-12 28-28 28v20c0 15-12 28-28 28h-20c-15 0-28-13-28-28v-20h-64v20c0 15-12 28-28 28h-20c-15 0-28-13-28-28v-20c-15 0-28-13-28-28V160z" fill="#ffffff" />
    
    <!-- Windshield -->
    <rect x="165" y="140" width="182" height="85" rx="12" fill="#1e293b" />
    
    <!-- Destination Display -->
    <rect x="190" y="150" width="132" height="20" rx="4" fill="#fbbf24" opacity="0.8" />
    
    <!-- Headlights -->
    <circle cx="185" cy="310" r="18" fill="#fbbf24" />
    <circle cx="327" cy="310" r="18" fill="#fbbf24" />
    
    <!-- Grille -->
    <rect x="210" y="300" width="92" height="25" rx="4" fill="#cbd5e1" />
  </g>
  
  <!-- "TM" Text -->
  <text x="256" y="275" font-family="Arial, sans-serif" font-weight="900" font-size="64" text-anchor="middle" fill="#1d4ed8">TM</text>
  
  <!-- Location Pin Overlay -->
  <path d="M400 100c-15 0-28 13-28 28 0 22 28 50 28 50s28-28 28-50c0-15-13-28-28-28zm0 40c-6 0-11-5-11-11s5-11 11-11 11 5 11 11-5 11-11 11z" fill="#f97316" />
</svg>
